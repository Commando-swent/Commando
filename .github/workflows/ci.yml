name: CI - Test Runner

# AI assistance: Claude Code for the parallel job layout (#437).

env:
  FIREBASE_TOOLS_VERSION: "15.32.1"

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build and the three test suites are independent, so they run as parallel jobs. The coverage
# job then merges the JaCoCo execution data of every test job before uploading it to SonarCloud.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the the gradle folder to reuse it later.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Firebase emulator cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      # Unit tests and the end-to-end test of the catalogue importer, against a local Firestore emulator
      # of the demo project (the importer never targets command-o when FIRESTORE_EMULATOR_HOST is set).
      # CATALOG_IMPORT_REQUIRE_EMULATOR makes the end-to-end test fail instead of skipping without it.
      - name: Catalogue import tests with Firestore emulator
        env:
          CATALOG_IMPORT_REQUIRE_EMULATOR: "true"
        run: >-
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec
          --non-interactive --project demo-commando --config firebase.firestore-open-test.json --only firestore
          'node --test tools/catalog-import/import.test.mjs'

      - name: Test CI discovery and coverage checks
        run: python3 scripts/ci/test_ci_checks.py

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      # Use the team keystore (SHA-1 registered in Firebase) when the secret is available
      - name: Decode signing keystore
        env:
          KS: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/ci.keystore"
            echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
          fi

      # Lint runs in the unit test job, as part of `check`.
      - name: Assemble
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assemble --parallel --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: commando-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  unit-tests:
    name: Unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Robolectric Android runtime cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Run unit tests and lint
      - name: Run tests
        run: |
          # To run the CI with debug information, add --info
          ./gradlew check --parallel --build-cache

      # The coverage job reads the unit test coverage, JUnit results and lint report for SonarCloud.
      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.xml
          if-no-files-found: error

  firebase-emulator-tests:
    name: Firebase emulator tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Robolectric Android runtime cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Firebase emulator cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: Run Firebase emulator tests
        run: bash scripts/ci/run-firebase-emulator-tests.sh

      # One execution data file per emulator profile, written by the script above.
      - name: Upload emulator test coverage
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-coverage
          path: app/build/jacoco/firebaseEmulator/
          if-no-files-found: error

  android-tests:
    name: Android tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Firebase emulator cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # The instrumented APKs are signed with the team keystore, as in the build job.
      - name: Decode signing keystore
        env:
          KS: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/ci.keystore"
            echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
          fi

      # Run connected tests on the emulator
      - name: Run Android tests with Firebase emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec
            --non-interactive --project demo-commando --config firebase.json --only auth,firestore
            './gradlew connectedCheck --parallel --build-cache -Pandroid.testInstrumentationRunnerArguments.firebaseEmulatorHost=10.0.2.2'

      - name: Upload Android test coverage
        uses: actions/upload-artifact@v4
        with:
          name: android-test-coverage
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/
          if-no-files-found: error

  coverage:
    name: Coverage and SonarCloud
    needs: [unit-tests, firebase-emulator-tests, android-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Each artifact is restored to the build path it was uploaded from.
      - name: Download unit test reports
        uses: actions/download-artifact@v4
        with:
          name: unit-test-reports
          path: app/build

      - name: Download emulator test coverage
        uses: actions/download-artifact@v4
        with:
          name: firebase-emulator-coverage
          path: app/build/jacoco/firebaseEmulator

      - name: Download Android test coverage
        uses: actions/download-artifact@v4
        with:
          name: android-test-coverage
          path: app/build/outputs/code_coverage/debugAndroidTest/connected

      # The tests already ran in the jobs above: compile the classes the report needs, without
      # running the unit tests again.
      - name: Generate Coverage Report
        run: |
          ./gradlew compileDebugKotlin jacocoTestReport -x testDebugUnitTest --build-cache

      - name: Validate Coverage Report
        run: >-
          python3 scripts/ci/validate-jacoco-report.py
          app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          app/src/main/java

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
